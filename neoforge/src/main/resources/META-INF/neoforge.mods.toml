modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Blazelow/Dawn-of-Time-Extra-Additions/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Blazelow/Dawn-of-Time-Extra-Additions"
authors = "${mod_author}"
credits = "${mod_credits}"
description = '''${mod_description}'''
logoFile = "icon.png"

[[mixins]]
config = "dawnoftimeextras.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "dawnoftimebuilder"
type = "required"
versionRange = "[1.6.6,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "dotbv"
type = "required"
versionRange = "[0.2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "fusion"
type = "required"
versionRange = "[1.3.15,)"
ordering = "AFTER"
side = "BOTH"
