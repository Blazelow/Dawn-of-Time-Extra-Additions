plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "dawn-of-time-extra-additions-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// The shared code and resources live in ../common and are compiled straight into this jar.
sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Dawn Of Time, to compile against; a hard
    // dependency at runtime, never bundled.
    compileOnly "maven.modrinth:dawn-of-time:${dot_neoforge_version}"
}

processResources {
    def props = [
            version          : project.version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_author       : mod_author,
            mod_license      : mod_license,
            mod_credits      : mod_credits,
            mod_description  : mod_description,
            minecraft_version: minecraft_version,
            neo_version      : neo_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
