name: Publish

run-name: "Dawn of Time: Extra Additions ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Read version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/*.jar
          name: DoT-Extra-Additions-fabric-1.21.1-${{ env.MOD_VERSION }}.jar
          changelog-file: CHANGELOG.md
          version-type: release
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            dawn-of-time(required)
            dawn-of-time-beyond-vanilla(required)
            fabric-api(required)
            fusion-connected-textures(required)

      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/*.jar
          name: DoT-Extra-Additions-neoforge-1.21.1-${{ env.MOD_VERSION }}.jar
          changelog-file: CHANGELOG.md
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            dawn-of-time(required)
            dawn-of-time-beyond-vanilla(required)
            fusion-connected-textures(required)
