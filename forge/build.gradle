plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = "dawn-of-time-extra-additions-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// The shared code and resources live in ../common and are compiled straight into this jar.
sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, 'dawnoftimeextras.refmap.json'
    config 'dawnoftimeextras.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Dawn Of Time, to compile against; a hard dependency at runtime, never bundled.
    modCompileOnly "maven.modrinth:dawn-of-time:${dot_forge_version}"
}

jar {
    manifest.attributes([
            "MixinConfigs": "dawnoftimeextras.mixins.json"
    ])
}

processResources {
    def props = [
            version          : project.version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_author       : mod_author,
            mod_license      : mod_license,
            mod_credits      : mod_credits,
            mod_description  : mod_description,
            minecraft_version: minecraft_version,
            forge_version    : forge_version
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}
